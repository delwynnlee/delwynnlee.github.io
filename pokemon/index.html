<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Browser</title>
<meta name="description" content="Browse all 1,025 Pokémon by type, region and base stats.">
<meta name="theme-color" content="#EBEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokémon">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;700&family=Unbounded:wght@600;800&display=swap">
<style>
:root {
  /* Layout: intro, then a sticky search bar over a dense grid of type-patterned cards grouped by region
     (2 columns on phones, up to 7 on desktop). A Pokémon opens in a sheet: hero art, stats, matchups, family. */
  --bg: #EBEEF3;
  --surface: #FFFFFF;
  --ink: #151922;
  --ink-2: #545D6C;
  --line: #D4DAE3;
  --track: #E3E7EE;
  --focus: #2E5BE6;
  --display: "Unbounded", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015; --surface: #171B22; --ink: #EDF0F5; --ink-2: #9CA6B5;
    --line: #29303B; --track: #252C37; --focus: #8AA8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #171B22; --ink: #EDF0F5; --ink-2: #9CA6B5;
  --line: #29303B; --track: #252C37; --focus: #8AA8FF;
  color-scheme: dark;
}
/* stat colour: a per-type token, darker on light surfaces and lighter on dark ones */
.dbody { --bar: var(--bar-l); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dbody { --bar: var(--bar-d); } }
:root[data-theme="dark"] .dbody { --bar: var(--bar-d); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.icon { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- intro, search, filters ---------- */
.intro { max-width: 1240px; margin: 0 auto; padding: 22px 16px 6px; }
.intro h1 { margin: 0; font: 800 clamp(28px, 7.4vw, 44px)/1.04 var(--display); letter-spacing: -.015em; text-wrap: balance; }
.intro p { margin: 8px 0 0; max-width: 62ch; color: var(--ink-2); }
.searchbar { position: sticky; top: 0; z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.searchbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.search { flex: 1; min-width: 0; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink-2); }
.search:focus-within { outline: 2.5px solid var(--focus); outline-offset: 1px; }
.search .icon { font-size: 20px; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 16px; }
.count { color: var(--ink-2); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.filters { max-width: 1240px; margin: 0 auto; padding: 2px 0 6px; display: grid; gap: 10px; }
.scroller { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.tchip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 15px 0 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 700; cursor: pointer; }
.disc { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--tc); color: var(--on); }
.disc .icon { font-size: 18px; }
.tchip[aria-pressed="true"] { background: var(--tc); border-color: var(--tc); color: var(--on); }
.tchip[aria-pressed="true"] .disc { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.pill { flex: none; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 14px; white-space: nowrap; cursor: pointer; }
.pill b { margin-right: 7px; font: 600 11px var(--display); color: var(--ink-2); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pill[aria-pressed="true"] b { color: inherit; opacity: .75; }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 0 16px; }
.opts label { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.opts select { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 14px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.clear { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 14px; font-weight: 700; cursor: pointer; }

/* ---------- grid and cards ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 0 16px 28px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(152px, calc(50% - 6px)), 1fr)); gap: 12px; }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px; } }
.status { grid-column: 1 / -1; margin: 0; padding: 24px 0; color: var(--ink-2); }
.sec { grid-column: 1 / -1; position: sticky; top: var(--sbh, 66px); z-index: 5; display: flex; align-items: baseline; gap: 10px; margin: 0 -16px; padding: 14px 18px 8px; background: var(--bg); }
.sec h2 { margin: 0; font: 800 21px/1.1 var(--display); letter-spacing: -.01em; }
.sec span { color: var(--ink-2); font-size: 14px; }
.sec .cnt { margin-left: auto; font-variant-numeric: tabular-nums; }
.card { display: flex; flex-direction: column; padding: 0; border: 0; border-radius: 18px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1px var(--line); text-align: left; cursor: pointer; }
.card:active { transform: scale(.98); }
.tex { background-color: var(--c1); background-image: var(--pat, none), linear-gradient(145deg, var(--c1) 6%, var(--c2) 96%); background-size: 64px 64px, 100% 100%; color: var(--sig); }
.art { position: relative; display: grid; place-items: center; aspect-ratio: 10 / 9; overflow: hidden; isolation: isolate; }
.art .no { position: absolute; right: 6px; bottom: -8px; z-index: -1; font: 800 46px/1 var(--display); letter-spacing: -.05em; opacity: .2; font-variant-numeric: tabular-nums; }
.sigil { width: 76%; height: 76%; overflow: visible; }
.art img { width: 88%; height: 88%; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .28)); }
.badge { position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(255, 255, 255, .9); color: #151922; font-size: 11px; font-weight: 700; }
.meta { display: grid; gap: 1px; padding: 10px 12px 12px; }
.meta .num { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.meta .nm { font-size: 16px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.types { display: flex; flex-wrap: wrap; gap: 5px; }
.meta .types { margin-top: 7px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 6px; border-radius: 999px; background: var(--tc); color: var(--on); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.chip .icon { font-size: 14px; stroke-width: 2.3; }
.chip .x { margin-left: 3px; font-variant-numeric: tabular-nums; }
.empty { padding: 40px 0; text-align: center; color: var(--ink-2); }
footer { max-width: 1240px; margin: 0 auto; padding: 4px 16px 44px; color: var(--ink-2); font-size: 13px; }
footer p { max-width: 72ch; margin: 0; }

/* ---------- detail sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; }
.sheet[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(6, 8, 12, .56); animation: fade .2s ease-out; }
.panel { position: relative; width: 100%; max-width: 580px; max-height: 94vh; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain; border-radius: 24px 24px 0 0; background: var(--surface); outline: none; animation: rise .3s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 720px) { .sheet { align-items: center; padding: 24px; } .panel { border-radius: 24px; max-height: 90vh; } }
@keyframes rise { from { transform: translateY(48px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scale(.15); opacity: 0; } }
.hero { position: relative; display: grid; place-items: center; min-height: 300px; padding: 64px 16px 18px; overflow: hidden; isolation: isolate; }
.hero .no { position: absolute; right: 12px; bottom: -18px; z-index: -1; font: 800 104px/1 var(--display); letter-spacing: -.05em; opacity: .18; }
.hero .radar { width: min(360px, 96%); }
.hero-img { width: min(270px, 74%); aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .3)); }
.hero .poly { animation: grow .55s cubic-bezier(.2, .8, .2, 1) both; }
.radar text { fill: currentColor; font-family: var(--body); }
.radar .l { font-size: 7.5px; }
.radar .v { font-size: 9.5px; font-weight: 700; }
.hero-bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; }
.hero-bar .sp { flex: 1; }
.round { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #151922; cursor: pointer; }
.round .icon { font-size: 20px; }
.round:disabled { opacity: .35; cursor: default; }
.dbody { display: grid; gap: 26px; padding: 18px 20px 30px; }
.dhead .num { margin: 0; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.dhead h2 { margin: 2px 0 10px; font: 800 clamp(26px, 7vw, 34px)/1.08 var(--display); letter-spacing: -.015em; text-wrap: balance; }
.cls { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.ext { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.dsec h3 { margin: 0 0 12px; font-size: 17px; }
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: 66px 34px 1fr; align-items: center; gap: 10px; font-size: 14px; }
.bar span:first-child { color: var(--ink-2); }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.track i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; background: var(--bar); }
.track::after { content: ""; position: absolute; top: 0; bottom: 0; left: 39.2%; width: 2px; background: var(--surface); }
.total { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 14px 0 0; }
.total span, .note { color: var(--ink-2); font-size: 14px; }
.note { margin: 10px 0 0; }
.statwrap { display: grid; gap: 14px; }
.statwrap .radar { width: min(300px, 100%); justify-self: center; color: var(--bar); }
.statwrap .radar text { fill: var(--ink); }
@media (min-width: 600px) { .statwrap { grid-template-columns: 210px 1fr; align-items: center; } }
.mu { display: grid; gap: 12px; }
.mu-row { display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: start; }
.mu-row > span { padding-top: 2px; color: var(--ink-2); font-size: 14px; }
.abil { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.abil li { font-weight: 700; }
.hid { margin-left: 6px; color: var(--ink-2); font-size: 13px; font-weight: 400; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin: 0; }
.facts dt { color: var(--ink-2); font-size: 13px; }
.facts dd { margin: 1px 0 0; font-weight: 700; }
.evo { display: grid; gap: 8px; }
.evo button { display: flex; align-items: center; gap: 12px; margin-left: calc(var(--d) * 20px); padding: 6px 12px 6px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; cursor: pointer; }
.evo button[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.mini { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 11px; background-size: 40px 40px, 100% 100%; overflow: hidden; }
.mini svg, .mini img { width: 86%; height: 86%; object-fit: contain; }
.evo b { display: block; }
.how { display: block; color: var(--ink-2); font-size: 13px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .card:active { transform: none; }
}
</style>
</head>
<body>
<header class="intro">
  <h1>Pokémon Browser</h1>
  <p id="lede">All 1,025 Pokémon, from Kanto to Paldea.</p>
</header>
<div class="searchbar" id="searchbar">
  <div class="searchbar-in">
    <label class="search" for="q">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13z M15.3 15.3 20 20"/></svg>
      <input id="q" type="search" placeholder="Name or number" autocomplete="off" spellcheck="false">
    </label>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
</div>
<div class="filters">
  <div class="scroller" id="types" role="group" aria-label="Filter by type"></div>
  <div class="scroller" id="gens" role="group" aria-label="Filter by region"></div>
  <div class="opts">
    <label for="cls"><span class="vh">Show</span>
      <select id="cls">
        <option value="">All Pokémon</option>
        <option value="Legendary">Legendary</option>
        <option value="Mythical">Mythical</option>
        <option value="Ultra Beast">Ultra Beasts</option>
        <option value="Paradox">Paradox</option>
      </select>
    </label>
    <label for="sort">Sort by
      <select id="sort">
        <option value="num">National Dex</option>
        <option value="name">Name</option>
        <option value="total">Base stat total</option>
        <option value="0">HP</option>
        <option value="1">Attack</option>
        <option value="2">Defense</option>
        <option value="3">Sp. Atk</option>
        <option value="4">Sp. Def</option>
        <option value="5">Speed</option>
      </select>
    </label>
    <button class="clear" id="clear" type="button" data-clear hidden>Clear filters</button>
  </div>
</div>
<main>
  <div class="grid" id="grid"><p class="status">Loading Pokémon…</p></div>
  <div class="empty" id="empty" hidden><p>No Pokémon match these filters.</p><button class="clear" type="button" data-clear>Clear filters</button></div>
  <div id="sentinel" aria-hidden="true"></div>
</main>
<footer><p id="foot"></p></footer>
<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <article class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="d-name" tabindex="-1"></article>
</div>
<script>
'use strict';
/* ---------- build-time settings ---------- */
const CONFIG = {"art":true,"data":null,"sw":true};   // { art: show PokéAPI artwork inline?, data: inline records or null to fetch pokemon.json, sw: register sw.js for offline use? }
const CHART = {"Normal":"000000100000030000","Fire":"021022001002100022","Water":"022112000000000020","Electric":"000200001200000020","Grass":"012221012101000000","Ice":"010002100000100010","Fighting":"000000000112200201","Poison":"000020221012000002","Ground":"001311020000200000","Flying":"000121203002100000","Psychic":"000000200021010100","Bug":"010020202100100000","Rock":"221010121200000010","Ghost":"300000320002010100","Dragon":"022221000000001001","Dark":"000000100031020201","Steel":"210022131222202022","Fairy":"000000210002003210"};     // defending type -> 18 digits by attacking type: 0 normal, 1 weak, 2 resists, 3 immune
const ART = n => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${n}.png`;

/* ---------- types: colour and emblem ---------- */
const TYPES = ['Normal', 'Fire', 'Water', 'Electric', 'Grass', 'Ice', 'Fighting', 'Poison', 'Ground',
  'Flying', 'Psychic', 'Bug', 'Rock', 'Ghost', 'Dragon', 'Dark', 'Steel', 'Fairy'];
const COLOR = { Normal: '#A39E8B', Fire: '#F0703A', Water: '#3F8CEB', Electric: '#F2C230', Grass: '#4FB35E',
  Ice: '#58C7D0', Fighting: '#C9453B', Poison: '#A24DBF', Ground: '#D3A452', Flying: '#8D9CF0',
  Psychic: '#EE5584', Bug: '#96AE2C', Rock: '#B39C55', Ghost: '#6A57A6', Dragon: '#5747D9',
  Dark: '#4E4653', Steel: '#8E9FB3', Fairy: '#E58DC6' };
function spiral() {
  let d = '';
  const T = 3.3 * Math.PI;
  for (let i = 0; i <= 44; i++) {
    const t = i / 44 * T, r = 1.2 + 7.6 * t / T;
    d += (i ? 'L' : 'M') + (12 + r * Math.cos(t + Math.PI)).toFixed(2) + ' ' + (12 + r * Math.sin(t + Math.PI)).toFixed(2);
  }
  return d;
}
// Original 24px line emblems, one per type.
const ICON = {
  Normal: 'M12 4.5a7.5 7.5 0 1 0 0 15a7.5 7.5 0 1 0 0-15z M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4z',
  Fire: 'M12 2.5C13.5 6 18 8.5 18 14a6 6 0 0 1-12 0c0-2.7 1.3-4.6 3-6c.2 2 1 3.2 2.3 3.6C10.6 8.6 10.9 5.3 12 2.5z',
  Water: 'M12 3C12 3 5.5 10.2 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10.2 12 3 12 3z M9 15.5a3 3 0 0 0 2.6 2.8',
  Electric: 'M13 2.5 5.5 13.5H11L10 21.5 18.5 10H13L13 2.5z',
  Grass: 'M5 19C5 10.5 10.5 4.5 20 4c-.5 9.5-6 15-15 15z M5 19l8.5-8.5 M3.5 20.5 5 19',
  Ice: 'M12 3.5v17 M4.64 7.75l14.72 8.5 M4.64 16.25l14.72-8.5 M10.02 4.52 12 6.5l1.98-1.98 M10.02 19.48 12 17.5l1.98 1.98 M19.47 9.98l-2.71-.73.73-2.7 M17.49 17.46l-.73-2.71 2.71-.72 M4.53 14.03l2.71.72-.73 2.71 M6.51 6.55l.73 2.7-2.71.73',
  Fighting: 'M12 2.5 13.61 8.12 18.72 5.28 15.88 10.39 21.5 12 15.88 13.61 18.72 18.72 13.61 15.88 12 21.5 10.39 15.88 5.28 18.72 8.12 13.61 2.5 12 8.12 10.39 5.28 5.28 10.39 8.12z',
  Poison: 'M9.5 3h5 M10.5 3v5.6A6.5 6.5 0 1 0 13.5 8.6V3 M7 15h10',
  Ground: 'M2.5 20h19 M4.5 20c1.4-5.5 4.3-8.5 7.5-8.5s6.1 3 7.5 8.5 M9 16.5h6',
  Flying: 'M3 13c4-6 10-8 18-8-1.5 2-3.5 3.2-6 3.8 2 .2 3.5.8 4.5 1.7-2 1.4-4.3 2-7 2 1.5.6 2.6 1.4 3.2 2.5C11 17 6.5 16.5 3 13z',
  Psychic: spiral(),
  Bug: 'M12 8.5c3 0 5 2.6 5 6s-2.2 6.5-5 6.5-5-3.1-5-6.5 2-6 5-6z M12 8.5V21 M10 8.8a2.2 2.2 0 1 1 4 0 M10.6 6.9 8.5 4 M13.4 6.9 15.5 4 M7.3 12.5 4.5 11 M7 16H4 M7.6 19.2l-2.6 1.5 M16.7 12.5l2.8-1.5 M17 16h3 M16.4 19.2l2.6 1.5',
  Rock: 'M4 17 6.5 8 12 4l6.5 3L21 15l-4 5H7z M6.5 8 12 12l6.5-5 M12 12v8',
  Ghost: 'M6 21V11a6 6 0 0 1 12 0v10l-2-1.6-2 1.6-2-1.6-2 1.6-2-1.6z M9.5 11v1 M14.5 11v1',
  Dragon: 'M2.5 12C5.5 7.5 8.5 6 12 6s6.5 1.5 9.5 6c-3 4.5-6 6-9.5 6s-6.5-1.5-9.5-6z M12 8.5c-.9 1-1.3 2.2-1.3 3.5s.4 2.5 1.3 3.5c.9-1 1.3-2.2 1.3-3.5s-.4-2.5-1.3-3.5z',
  Dark: 'M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a6.5 6.5 0 0 0 10 10z',
  Steel: 'M21 12l-4.5 7.8h-9L3 12l4.5-7.8h9z M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z',
  Fairy: 'M12 3Q13 11 21 12Q13 13 12 21Q11 13 3 12Q11 11 12 3z M18.5 3.5v3 M17 5h3',
};
const icon = t => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[t]}"/></svg>`;
const SVG_PATH = { left: 'M15 5l-7 7 7 7', right: 'M9 5l7 7-7 7', close: 'M6 6l12 12M18 6 6 18',
  ext: 'M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5' };
const glyph = k => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${SVG_PATH[k]}"/></svg>`;

const REGION = ['', 'Kanto', 'Johto', 'Hoenn', 'Sinnoh', 'Unova', 'Kalos', 'Alola', 'Galar', 'Paldea'];
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];
const regionOf = m => m.gen === 8 && m.num >= 899 ? 'Hisui' : REGION[m.gen];
const sectionName = g => g === 8 ? 'Galar & Hisui' : REGION[g];
const STAT = ['HP', 'Attack', 'Defense', 'Sp. Atk', 'Sp. Def', 'Speed'];
const STAT_SHORT = ['HP', 'Atk', 'Def', 'SpA', 'SpD', 'Spe'];
const RING = [0, 1, 2, 5, 4, 3]; // stat at each hexagon corner, clockwise from the top: physical right, special left, speed below

/* ---------- colour helpers ---------- */
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbHex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return rgbHex(A.map((v, i) => v + (B[i] - v) * t)); };
const lum = h => { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const WHITE = '#FFFFFF', INK = '#161A22';
const shadeFor = (c, bg, toward) => { let x = c; for (let i = 1; contrast(x, bg) < 3 && i <= 12; i++) x = mix(c, toward, i * .06); return x; };
const ON = {}, BAR = {};
for (const t of TYPES) {
  ON[t] = contrast(COLOR[t], WHITE) >= contrast(COLOR[t], INK) ? WHITE : INK;
  BAR[t] = [shadeFor(COLOR[t], '#FFFFFF', '#000000'), shadeFor(COLOR[t], '#171B22', '#FFFFFF')];
}

/* ---------- generated graphics ---------- */
const patSheet = document.head.appendChild(document.createElement('style'));
const patDone = {};
function patternClass(t, ink) {           // a tile of the type's emblem, painted once per type and ink
  const cls = `pt-${t}-${ink === WHITE ? 'w' : 'k'}`;
  if (!patDone[cls]) {
    patDone[cls] = 1;
    const S = 128, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d'), p = new Path2D(ICON[t]);
    g.strokeStyle = ink; g.globalAlpha = ink === WHITE ? .2 : .15;
    g.lineCap = g.lineJoin = 'round'; g.lineWidth = 1.8;
    for (const [x, y, r] of [[.27, .29, -.3], [.77, .79, .25]]) {
      g.save(); g.translate(x * S, y * S); g.rotate(r); g.scale(1.85, 1.85); g.translate(-12, -12); g.stroke(p); g.restore();
    }
    patSheet.textContent += `.${cls}{--pat:url(${cv.toDataURL()})}`;
  }
  return cls;
}
function look(m) {                         // card colours: type gradient, emblem pattern, legible ink
  if (!m._look) {
    const c1 = COLOR[m.types[0]], c2 = m.types[1] ? COLOR[m.types[1]] : mix(c1, '#000000', .3);
    const ink = contrast(mix(c1, c2, .5), WHITE) >= 2.6 ? WHITE : INK;
    m._look = { cls: 'tex ' + patternClass(m.types[0], ink), style: `--c1:${c1};--c2:${c2};--sig:${ink}` };
  }
  return m._look;
}
const f1 = n => Math.round(n * 10) / 10;
const vtx = (k, r) => { const a = (k / 3 - .5) * Math.PI; return [f1(r * Math.cos(a)), f1(r * Math.sin(a))]; };
const RMAX = 46;
const rad = v => 6 + 40 * Math.sqrt(Math.min(v, 255) / 255);   // square-root radius, so area tracks the stat
const GRID = (() => {
  let d = '';
  for (const r of [19.3, 32.7, RMAX]) d += 'M' + [0, 1, 2, 3, 4, 5].map(k => vtx(k, r).join(' ')).join('L') + 'Z';
  for (let k = 0; k < 6; k++) d += 'M0 0L' + vtx(k, RMAX).join(' ');
  return d;
})();
function sigil(m, labeled) {               // the six base stats as a hexagon: every species gets its own shape
  const pts = RING.map((s, k) => vtx(k, rad(m.stats[s])));
  const r = labeled ? 2.3 : 2.8;
  const dots = pts.map(([x, y]) => `M${f1(x - r)} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`).join('');
  let s = `<svg class="${labeled ? 'radar' : 'sigil'}" viewBox="${labeled ? '-76 -70 152 140' : '-50 -50 100 100'}" aria-hidden="true">`
    + `<path d="${GRID}" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="${labeled ? .8 : 1}"/>`
    + `<g class="poly"><polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="currentColor" fill-opacity=".4" stroke="currentColor" stroke-width="${labeled ? 1.6 : 2.2}" stroke-linejoin="round"/>`
    + `<path d="${dots}" fill="currentColor"/></g>`;
  if (labeled) s += RING.map((st, k) => {
    const [x, y] = vtx(k, 60);
    return `<text x="${x}" y="${y}" text-anchor="middle"><tspan class="l" x="${x}" dy="-.15em">${STAT_SHORT[st]}</tspan><tspan class="v" x="${x}" dy="1.05em">${m.stats[st]}</tspan></text>`;
  }).join('');
  return s + '</svg>';
}
const picture = (m, cls = '') => CONFIG.art
  ? `<img class="${cls}" src="${ART(m.num)}" alt="" loading="lazy" decoding="async" crossorigin="anonymous">`
  : sigil(m, false);

/* ---------- small renderers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(4, '0');
const chip = (t, extra = '') => `<span class="chip" style="--tc:${COLOR[t]};--on:${ON[t]}">${icon(t)}${t}${extra}</span>`;
function card(m) {
  const L = look(m);
  return `<button class="card" type="button" data-id="${m.id}" aria-label="${esc(m.name)}, number ${m.num}">`
    + `<span class="art ${L.cls}" style="${L.style}">${m.class ? `<span class="badge">${m.class}</span>` : ''}<span class="no" aria-hidden="true">${m.num}</span>${picture(m)}</span>`
    + `<span class="meta"><span class="num">#${pad(m.num)}</span><span class="nm">${esc(m.name)}</span><span class="types">${m.types.map(t => chip(t)).join('')}</span></span></button>`;
}
const sectionHead = (g, n) => `<div class="sec"><h2>${sectionName(g)}</h2><span>Generation ${ROMAN[g]}</span><span class="cnt">${n}</span></div>`;

/* ---------- data ---------- */
let ALL = [], BY = {}, KIDS = {}, list = [], rendered = 0, lastGen = 0, genCount = {}, current = null, opener = null;
const $ = id => document.getElementById(id);
const grid = $('grid'), sheet = $('sheet'), panel = $('panel'), sentinel = $('sentinel');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function prepare(data) {
  ALL = data;
  for (const m of ALL) { m.total = m.stats.reduce((a, b) => a + b, 0); m.key = norm(m.name) + ' ' + m.id; BY[m.id] = m; }
  for (const m of ALL) if (m.from && BY[m.from]) (KIDS[m.from] = KIDS[m.from] || []).push(m);
  const totals = ALL.map(m => m.total).sort((a, b) => a - b);
  for (const m of ALL) { let lo = 0; while (totals[lo] < m.total) lo++; m.pct = Math.round(100 * lo / (ALL.length - 1)); }
}

/* ---------- browse ---------- */
const state = { q: '', types: [], gen: 0, cls: '', sort: 'num' };
function buildFilters() {
  $('types').innerHTML = TYPES.map(t => `<button class="tchip" type="button" data-type="${t}" aria-pressed="false" style="--tc:${COLOR[t]};--on:${ON[t]}"><span class="disc">${icon(t)}</span>${t}</button>`).join('');
  $('gens').innerHTML = `<button class="pill" type="button" data-gen="0" aria-pressed="true">All regions</button>`
    + REGION.slice(1).map((r, i) => `<button class="pill" type="button" data-gen="${i + 1}" aria-pressed="false"><b>${ROMAN[i + 1]}</b>${r}</button>`).join('');
}
function syncFilters() {
  for (const b of $('types').children) b.setAttribute('aria-pressed', state.types.includes(b.dataset.type));
  for (const b of $('gens').children) b.setAttribute('aria-pressed', +b.dataset.gen === state.gen);
  $('clear').hidden = !(state.q || state.types.length || state.gen || state.cls);
}
function apply(fromUser) {
  const q = norm(state.q), digits = /^\d+$/.test(q) ? String(+q) : null;
  list = ALL.filter(m => (!q || (digits ? String(m.num) === digits : m.key.includes(q)))
    && state.types.every(t => m.types.includes(t))
    && (!state.gen || m.gen === state.gen)
    && (!state.cls || m.class === state.cls));
  const s = state.sort;
  list.sort(s === 'num' ? (a, b) => a.num - b.num
    : s === 'name' ? (a, b) => a.name.localeCompare(b.name)
    : s === 'total' ? (a, b) => b.total - a.total || a.num - b.num
    : (a, b) => b.stats[s] - a.stats[s] || a.num - b.num);
  genCount = {};
  for (const m of list) genCount[m.gen] = (genCount[m.gen] || 0) + 1;
  grid.innerHTML = ''; rendered = 0; lastGen = 0;
  $('count').textContent = `${list.length.toLocaleString('en')} Pokémon`;
  $('empty').hidden = list.length > 0;
  syncFilters();
  if (fromUser) {
    const top = grid.getBoundingClientRect().top + scrollY - $('searchbar').offsetHeight - 8;
    if (scrollY > top) scrollTo(0, top);
  }
  fill();
}
function renderMore() {
  const end = Math.min(rendered + 48, list.length);
  let html = '';
  for (let i = rendered; i < end; i++) {
    const m = list[i];
    if (state.sort === 'num' && m.gen !== lastGen) { lastGen = m.gen; html += sectionHead(m.gen, genCount[m.gen]); }
    html += card(m);
  }
  grid.insertAdjacentHTML('beforeend', html);
  rendered = end;
}
function fill() {
  for (let n = 0; rendered < list.length && n < 30 && sentinel.getBoundingClientRect().top < innerHeight + 1400; n++) renderMore();
}
new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) fill(); }, { rootMargin: '1400px 0px' }).observe(sentinel);

$('types').addEventListener('click', e => {
  const b = e.target.closest('[data-type]'); if (!b) return;
  const t = b.dataset.type, i = state.types.indexOf(t);
  if (i >= 0) state.types.splice(i, 1); else { state.types.push(t); if (state.types.length > 2) state.types.shift(); }
  apply(true);
});
$('gens').addEventListener('click', e => {
  const b = e.target.closest('[data-gen]'); if (!b) return;
  state.gen = +b.dataset.gen; apply(true);
});
let typing;
$('q').addEventListener('input', e => { clearTimeout(typing); typing = setTimeout(() => { state.q = e.target.value; apply(true); }, 120); });
$('cls').addEventListener('change', e => { state.cls = e.target.value; apply(true); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; apply(true); });
document.addEventListener('click', e => {
  if (!e.target.closest('[data-clear]')) return;
  Object.assign(state, { q: '', types: [], gen: 0, cls: '' });
  $('q').value = ''; $('cls').value = '';
  apply(true);
});
grid.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) { opener = c; location.hash = c.dataset.id; } });
grid.addEventListener('error', e => {        // artwork that fails to load falls back to the stat emblem
  if (e.target.tagName !== 'IMG') return;
  const id = e.target.closest('.card')?.dataset.id;
  if (id) e.target.outerHTML = sigil(BY[id], false);
}, true);

/* ---------- detail ---------- */
function matchups(m) {
  const g = {};
  TYPES.forEach((a, ai) => {
    let x = 1;
    for (const d of m.types) x *= [1, 2, .5, 0][+CHART[d][ai]];
    if (x !== 1) (g[x] = g[x] || []).push(a);
  });
  const tagged = (ts, x) => (ts || []).map(t => chip(t, x ? `<span class="x">${x}</span>` : ''));
  const row = (label, items) => items.length ? `<div class="mu-row"><span>${label}</span><div class="types">${items.join('')}</div></div>` : '';
  return `<div class="mu">${row('Weak to', [...tagged(g[4], '×4'), ...tagged(g[2], '×2')])}`
    + `${row('Resists', [...tagged(g[0.5], '×½'), ...tagged(g[0.25], '×¼')])}${row('Immune to', tagged(g[0]))}</div>`;
}
function bars(m) {
  return `<div class="bars">${m.stats.map((v, i) => `<div class="bar"><span>${STAT[i]}</span><b>${v}</b><span class="track"><i style="width:${f1(v / 2.55)}%"></i></span></div>`).join('')}</div>`;
}
const gender = f => f == null ? 'Genderless' : f === 0 ? 'Male only' : f === 100 ? 'Female only' : `${f}% female`;
function family(m) {
  let root = m;
  while (root.from && BY[root.from]) root = BY[root.from];
  const rows = [];
  (function walk(x, d) { rows.push([x, d]); for (const k of (KIDS[x.id] || []).sort((a, b) => a.num - b.num)) walk(k, d + 1); })(root, 0);
  if (rows.length === 1) return `<p class="note">${esc(m.name)} doesn't evolve.</p>`;
  return `<div class="evo">${rows.map(([x, d]) => {
    const L = look(x);
    return `<button type="button" data-go="${x.id}" style="--d:${d}"${x === m ? ' aria-current="true"' : ''}>`
      + `<span class="mini ${L.cls}" style="${L.style}">${picture(x)}</span>`
      + `<span><b>${esc(x.name)}</b><span class="how">${d ? esc(x.method || 'Evolves') : 'First stage'}</span></span></button>`;
  }).join('')}</div>`;
}
function navSeq(m) { return list.includes(m) ? list : ALL; }
function detail(m) {
  const L = look(m), seq = navSeq(m), i = seq.indexOf(m), prev = seq[i - 1], next = seq[i + 1];
  const total = m.pct >= 100 ? 'The highest of any Pokémon' : m.pct <= 0 ? 'The lowest of any Pokémon' : `Higher than ${m.pct}% of Pokémon`;
  const fact = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  const [bl, bd] = BAR[m.types[0]];
  return `<div class="hero ${L.cls}" style="${L.style}">`
    + `<div class="hero-bar">`
    + `<button class="round" type="button" data-dir="-1" data-go="${prev ? prev.id : ''}" ${prev ? `aria-label="Previous: ${esc(prev.name)}"` : 'aria-label="Previous" disabled'}>${glyph('left')}</button>`
    + `<button class="round" type="button" data-dir="1" data-go="${next ? next.id : ''}" ${next ? `aria-label="Next: ${esc(next.name)}"` : 'aria-label="Next" disabled'}>${glyph('right')}</button>`
    + `<span class="sp"></span><button class="round" type="button" data-close aria-label="Close">${glyph('close')}</button></div>`
    + `<span class="no" aria-hidden="true">${m.num}</span>`
    + (CONFIG.art ? `<img class="hero-img" src="${ART(m.num)}" alt="Official artwork of ${esc(m.name)}" crossorigin="anonymous">` : sigil(m, true))
    + `</div><div class="dbody" style="--bar-l:${bl};--bar-d:${bd}">`
    + `<header class="dhead"><p class="num">#${pad(m.num)}, ${regionOf(m)}</p><h2 id="d-name">${esc(m.name)}</h2>`
    + `<div class="types">${m.types.map(t => chip(t)).join('')}${m.class ? `<span class="cls">${m.class}</span>` : ''}</div>`
    + (CONFIG.art ? '' : `<a class="ext" href="${ART(m.num)}" target="_blank" rel="noopener">See official artwork ${glyph('ext')}</a>`)
    + `</header>`
    + `<section class="dsec"><h3>Base stats</h3>${CONFIG.art ? `<div class="statwrap">${sigil(m, true)}${bars(m)}</div>` : bars(m)}`
    + `<p class="total"><b>Total ${m.total}</b><span>${total}</span></p><p class="note">Bars run from 0 to 255. The notch marks 100.</p></section>`
    + `<section class="dsec"><h3>Type matchups</h3>${matchups(m)}<p class="note">Based on type alone. Some abilities change these.</p></section>`
    + `<section class="dsec"><h3>Abilities</h3><ul class="abil">${m.abilities.map(a => `<li>${esc(a)}</li>`).join('')}`
    + `${m.hidden ? `<li>${esc(m.hidden)}<span class="hid">Hidden ability</span></li>` : ''}</ul></section>`
    + `<section class="dsec"><h3>Profile</h3><dl class="facts">${fact('Height', `${m.height} m`)}${fact('Weight', `${f1(m.weight)} kg`)}`
    + `${fact('Gender', gender(m.female))}${fact('Egg groups', m.eggGroups.map(esc).join(', '))}${fact('Introduced', `Generation ${ROMAN[m.gen]}`)}${fact('Region', regionOf(m))}</dl></section>`
    + `<section class="dsec"><h3>Evolution</h3>${family(m)}</section></div>`;
}
function show(m) {
  current = m;
  panel.innerHTML = detail(m);
  if (sheet.hidden) { sheet.hidden = false; document.body.classList.add('locked'); }
  panel.scrollTop = 0;
  panel.focus({ preventScroll: true });
}
function hide() {
  if (sheet.hidden) return;
  sheet.hidden = true; document.body.classList.remove('locked'); current = null;
  if (opener && document.contains(opener)) opener.focus({ preventScroll: true });
}
function go(id) { try { location.replace('#' + id); } catch (e) { location.hash = id; } }
function closeSheet() { go(''); }
function route() { const id = decodeURIComponent(location.hash.slice(1)); if (BY[id]) show(BY[id]); else hide(); }
addEventListener('hashchange', route);
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b && b.dataset.go) return go(b.dataset.go);
  if (e.target.closest('[data-close]')) closeSheet();
});
sheet.querySelector('.scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (sheet.hidden) return;
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const b = panel.querySelector(`[data-dir="${e.key === 'ArrowLeft' ? -1 : 1}"]`);
    if (b && !b.disabled) b.click();
  }
});
let touch = null;                           // swipe sideways for the previous or next Pokémon
panel.addEventListener('touchstart', e => { touch = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
panel.addEventListener('touchend', e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch[0], dy = e.changedTouches[0].clientY - touch[1];
  touch = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 1.6 * Math.abs(dy)) {
    const b = panel.querySelector(`[data-dir="${dx < 0 ? 1 : -1}"]`);
    if (b && !b.disabled) b.click();
  }
});
panel.addEventListener('error', e => {
  if (e.target.tagName !== 'IMG' || !current) return;
  const id = e.target.closest('[data-go]')?.dataset.go;
  e.target.outerHTML = sigil(id ? BY[id] : current, e.target.classList.contains('hero-img'));
}, true);

/* ---------- start ---------- */
$('lede').textContent = CONFIG.art
  ? 'All 1,025 Pokémon, from Kanto to Paldea, with official artwork loaded from PokéAPI.'
  : "All 1,025 Pokémon, from Kanto to Paldea. Each card's shape traces its six base stats, starting with HP at the top and going clockwise through Attack, Defense, Speed, Sp. Def and Sp. Atk.";
$('foot').textContent = 'Unofficial fan project. Pokémon and Pokémon character names are trademarks of Nintendo, Creatures and GAME FREAK. Stats, abilities and evolutions come from Pokémon Showdown’s data. '
  + (CONFIG.art ? 'Artwork is loaded from PokéAPI’s sprite collection.' : 'Card emblems are drawn from each Pokémon’s base stats. Artwork links open PokéAPI’s sprite collection.')
  + (CONFIG.sw ? ' Artwork you’ve viewed is saved on this device, so it opens instantly next time and works offline.' : '');
if (CONFIG.sw && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const setBarHeight = () => document.documentElement.style.setProperty('--sbh', $('searchbar').offsetHeight + 'px');
addEventListener('resize', setBarHeight);
setBarHeight();
buildFilters();
(CONFIG.data ? Promise.resolve(CONFIG.data) : fetch('pokemon.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
  .then(data => { prepare(data); apply(false); route(); })
  .catch(() => { grid.innerHTML = '<p class="status">The Pokémon data didn’t load. Reload the page to try again.</p>'; });
</script>
</body>
</html>
